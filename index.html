
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Menopause Wellness AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
  <form id="wellnessForm">
    Age: <input type="number" name="age" /><br>
    Weight: <input type="number" name="weight" /><br>
    Height: <input type="number" name="height" /><br>
    Waist: <input type="number" name="waist" /><br>
    Ethnicity:
    <select name="ethnicity">
      <option value="Caucasian">Caucasian</option>
      <option value="Asian">Asian</option>
    </select><br>
    <label><input type="checkbox" name="diet" value="Vegan" /> Vegan</label><br>
    <label><input type="checkbox" name="diet" value="Vegetarian" /> Vegetarian</label><br>
    <button type="submit">Generate Plan</button>
  </form>
  <textarea id="result"></textarea>
  <script>
    document.getElementById('wellnessForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = {};
      for (const [key, value] of formData.entries()) {
        if (data[key]) {
          data[key] += ', ' + value;
        } else {
          data[key] = value;
        }
      }
      try {
        const response = await fetch('https://meno-ai-app.onrender.com/generate-plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.pdf) {
          const link = document.createElement('a');
          link.href = result.pdf;
          link.download = "wellness_plan.pdf";
          link.click();
          document.getElementById('result').value = "✅ PDF downloaded.";
        } else {
          document.getElementById('result').value = "Error or no data returned.";
        }
      } catch (err) {
        document.getElementById('result').value = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
